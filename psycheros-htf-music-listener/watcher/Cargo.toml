[package]
name = "psycheros-now-playing-watcher"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation",
  "Media_Control",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.18.0"

[profile.release]
lto = true
opt-level = "s"
strip = true
